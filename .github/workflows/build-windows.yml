name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pytest soundfile
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke test CLI (generates a song)
        run: python run_app.py -g all --bars 8 --seed 1 -o ci_output
      - name: Verify GUI module imports (tkinter available)
        run: python -c "import sys; sys.path.insert(0,'src'); import aimusicgen.gui"
